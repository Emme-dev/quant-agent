[project]
name = "quantagent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "ccxt>=4.3",
  "sqlalchemy>=2.0",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pyarrow>=14.0",
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
